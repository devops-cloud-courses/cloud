<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="18" fill="#f8fafc"/>
  <rect width="960" height="390" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Left: On-Premises -->
    <rect x="36" y="128" width="196" height="134" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="134" y="172" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">On-Premises</text>
    <text x="134" y="196" text-anchor="middle" font-size="12.5" fill="#64748b">Corporate Network</text>
    <rect x="56" y="212" width="156" height="32" rx="6" fill="#f1f5f9"/>
    <text x="134" y="233" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#334155">VPN / ExpressRoute</text>

    <!-- Center: Hub VNet -->
    <rect x="304" y="64" width="268" height="262" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="328" y="84" width="220" height="36" rx="8" fill="#2563eb"/>
    <text x="438" y="107" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">Central Hub VNet / VPC</text>
    <rect x="328" y="134" width="220" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="438" y="162" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Cloud Firewall &amp; Routing</text>
    <rect x="328" y="192" width="220" height="46" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="438" y="220" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">VPN / ER Gateway</text>
    <rect x="328" y="250" width="220" height="54" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="438" y="275" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Shared Services</text>
    <text x="438" y="293" text-anchor="middle" font-size="11.5" fill="#64748b">DNS • Bastion • AD • Monitoring</text>

    <!-- Right: Spoke VNets -->
    <rect x="656" y="34" width="268" height="96" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="790" y="68" text-anchor="middle" font-size="15" font-weight="800" fill="#047857">Spoke 1: Production VNet</text>
    <text x="790" y="92" text-anchor="middle" font-size="12.5" fill="#64748b">Isolated Workload A</text>
    <text x="790" y="112" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669">VNet Peering to Hub</text>

    <rect x="656" y="147" width="268" height="96" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="790" y="181" text-anchor="middle" font-size="15" font-weight="800" fill="#047857">Spoke 2: Staging VNet</text>
    <text x="790" y="205" text-anchor="middle" font-size="12.5" fill="#64748b">Pre-Production Workload</text>
    <text x="790" y="225" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669">VNet Peering to Hub</text>

    <rect x="656" y="260" width="268" height="96" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="790" y="294" text-anchor="middle" font-size="15" font-weight="800" fill="#047857">Spoke 3: Data &amp; Analytics</text>
    <text x="790" y="318" text-anchor="middle" font-size="12.5" fill="#64748b">Isolated Data Platform</text>
    <text x="790" y="338" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669">VNet Peering to Hub</text>
  </g>

  <!-- Peering Lines -->
  <line x1="236" y1="195" x2="296" y2="195" stroke="#2563eb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="576" y1="145" x2="648" y2="85" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="576" y1="195" x2="648" y2="195" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="576" y1="245" x2="648" y2="305" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
