<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gCustomer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gProvider" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="980" height="460" rx="18" fill="#f8fafc"/>
  <rect width="980" height="460" rx="18" fill="url(#dotGrid)"/>

  <!-- Legend -->
  <g transform="translate(270, 16)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="url(#gCustomer)"/>
    <text x="26" y="14" font-size="13.5" font-weight="700" fill="#1e293b">Customer Manages</text>
    <rect x="210" y="0" width="18" height="18" rx="4" fill="url(#gProvider)"/>
    <text x="236" y="14" font-size="13.5" font-weight="700" fill="#1d4ed8">Cloud Provider (CSP) Manages</text>
  </g>

  <!-- Column Headers -->
  <g font-size="15" font-weight="800" text-anchor="middle">
    <text x="122" y="64" fill="#0f172a">On-Premises</text>
    <text x="306" y="64" fill="#0f172a">IaaS</text>
    <text x="490" y="64" fill="#0f172a">PaaS</text>
    <text x="674" y="64" fill="#0f172a">FaaS / Serverless</text>
    <text x="858" y="64" fill="#0f172a">SaaS</text>
  </g>

  <!-- 9 Layers per column: Applications, Data, Runtime, Middleware, OS, Virtualization, Servers, Storage, Networking -->
  <!-- Y positions: 78, 118, 158, 198, 238, 278, 318, 358, 398 (height 34, gap 6) -->
  <g font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">
    <!-- Col 1: On-Premises (All Customer) -->
    <g transform="translate(42, 0)">
      <rect y="78" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="100">Applications</text>
      <rect y="118" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="140">Data &amp; Config</text>
      <rect y="158" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="180">Runtime</text>
      <rect y="198" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="220">Middleware</text>
      <rect y="238" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="260">Operating System</text>
      <rect y="278" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="300">Virtualization</text>
      <rect y="318" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="340">Servers</text>
      <rect y="358" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="380">Storage</text>
      <rect y="398" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="420">Networking</text>
    </g>

    <!-- Col 2: IaaS (5 Customer, 4 Provider) -->
    <g transform="translate(226, 0)">
      <rect y="78" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="100">Applications</text>
      <rect y="118" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="140">Data &amp; Config</text>
      <rect y="158" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="180">Runtime</text>
      <rect y="198" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="220">Middleware</text>
      <rect y="238" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="260">Operating System</text>
      <rect y="278" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="300">Virtualization</text>
      <rect y="318" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="340">Servers</text>
      <rect y="358" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="380">Storage</text>
      <rect y="398" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="420">Networking</text>
    </g>

    <!-- Col 3: PaaS (2 Customer, 7 Provider) -->
    <g transform="translate(410, 0)">
      <rect y="78" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="100">Applications</text>
      <rect y="118" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="140">Data &amp; Config</text>
      <rect y="158" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="180">Runtime</text>
      <rect y="198" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="220">Middleware</text>
      <rect y="238" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="260">Operating System</text>
      <rect y="278" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="300">Virtualization</text>
      <rect y="318" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="340">Servers</text>
      <rect y="358" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="380">Storage</text>
      <rect y="398" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="420">Networking</text>
    </g>

    <!-- Col 4: FaaS / Serverless (Functions & Data only) -->
    <g transform="translate(594, 0)">
      <rect y="78" width="160" height="34" rx="6" fill="url(#gCustomer)"/><text x="80" y="100">Functions / Logic</text>
      <rect y="118" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="140">Managed State</text>
      <rect y="158" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="180">Runtime</text>
      <rect y="198" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="220">Middleware</text>
      <rect y="238" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="260">Operating System</text>
      <rect y="278" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="300">Virtualization</text>
      <rect y="318" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="340">Servers</text>
      <rect y="358" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="380">Storage</text>
      <rect y="398" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="420">Networking</text>
    </g>

    <!-- Col 5: SaaS (All Provider) -->
    <g transform="translate(778, 0)">
      <rect y="78" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="100">Applications</text>
      <rect y="118" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="140">Data &amp; Config</text>
      <rect y="158" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="180">Runtime</text>
      <rect y="198" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="220">Middleware</text>
      <rect y="238" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="260">Operating System</text>
      <rect y="278" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="300">Virtualization</text>
      <rect y="318" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="340">Servers</text>
      <rect y="358" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="380">Storage</text>
      <rect y="398" width="160" height="34" rx="6" fill="url(#gProvider)"/><text x="80" y="420">Networking</text>
    </g>
  </g>
</svg>
