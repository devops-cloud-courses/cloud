<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="18" fill="#f8fafc"/>
  <rect width="960" height="360" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Step 1 -->
    <rect x="38" y="42" width="266" height="276" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="171" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Step 1: Initial Fleet</text>
    <rect x="64" y="96" width="214" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="171" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Instance 1 (v1.0)</text>
    <rect x="64" y="164" width="214" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="171" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Instance 2 (v1.0)</text>
    <rect x="64" y="232" width="214" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="171" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Instance 3 (v1.0)</text>

    <line x1="308" y1="180" x2="338" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <rect x="346" y="42" width="266" height="276" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="479" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">Step 2: Rolling Replace</text>
    <rect x="372" y="96" width="214" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="479" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Instance 1 (v2.0 Healthy)</text>
    <rect x="372" y="164" width="214" height="54" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="479" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Instance 2 (Draining → v2)</text>
    <rect x="372" y="232" width="214" height="54" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="479" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Instance 3 (v1.0)</text>

    <line x1="616" y1="180" x2="646" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <rect x="654" y="42" width="268" height="276" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="788" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#047857">Step 3: 100% Updated</text>
    <rect x="680" y="96" width="216" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="788" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Instance 1 (v2.0)</text>
    <rect x="680" y="164" width="216" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="788" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Instance 2 (v2.0)</text>
    <rect x="680" y="232" width="216" height="54" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="788" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Instance 3 (v2.0)</text>
  </g>
</svg>
