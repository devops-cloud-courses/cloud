<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowTime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="380" rx="18" fill="#f8fafc"/>
  <rect width="960" height="380" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- RPO Range Card -->
    <rect x="115" y="32" width="335" height="106" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="282" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="#1d4ed8">RPO (Recovery Point Objective)</text>
    <text x="282" y="92" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">Maximum acceptable data loss (time)</text>
    <text x="282" y="116" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">Driven by Backup / Replication Frequency</text>

    <!-- RTO Range Card -->
    <rect x="490" y="32" width="335" height="106" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="657" y="66" text-anchor="middle" font-size="19" font-weight="800" fill="#047857">RTO (Recovery Time Objective)</text>
    <text x="657" y="92" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065f46">Maximum acceptable service downtime</text>
    <text x="657" y="116" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#059669">Driven by Automation &amp; Failover Speed</text>

    <!-- Milestone 1: Last Backup -->
    <rect x="40" y="256" width="150" height="72" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="115" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">Last Backup</text>
    <text x="115" y="308" text-anchor="middle" font-size="12.5" fill="#475569">Snapshot saved</text>

    <!-- Milestone 2: Disaster Strikes -->
    <rect x="385" y="256" width="170" height="72" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="470" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#be123c">Incident / Outage</text>
    <text x="470" y="308" text-anchor="middle" font-size="12.5" fill="#9f1239">Disaster occurs</text>

    <!-- Milestone 3: Service Restored -->
    <rect x="745" y="256" width="160" height="72" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="825" y="286" text-anchor="middle" font-size="14.5" font-weight="800" fill="#047857">Service Restored</text>
    <text x="825" y="308" text-anchor="middle" font-size="12.5" fill="#475569">Back online</text>

    <!-- Time Legend Pill (Unobstructed at right of axis) -->
    <rect x="854" y="164" width="84" height="32" rx="8" fill="#0f172a"/>
    <text x="896" y="185" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Time →</text>
  </g>

  <!-- Vertical Guide Lines -->
  <line x1="115" y1="142" x2="115" y2="252" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="470" y1="142" x2="470" y2="252" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="825" y1="142" x2="825" y2="252" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- RPO & RTO Span Arrows -->
  <line x1="125" y1="176" x2="458" y2="176" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <rect x="228" y="162" width="130" height="26" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="293" y="179" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#1e40af">◄ RPO Window ►</text>

  <line x1="482" y1="176" x2="815" y2="176" stroke="#059669" stroke-width="2.5" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <rect x="583" y="162" width="130" height="26" rx="6" fill="#d1fae5" stroke="#34d399" stroke-width="1"/>
  <text x="648" y="179" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#065f46">◄ RTO Window ►</text>

  <!-- Main Timeline Axis -->
  <line x1="40" y1="220" x2="928" y2="220" stroke="#0f172a" stroke-width="4" marker-end="url(#arrowTime)"/>

  <!-- Timeline Milestone Nodes -->
  <circle cx="115" cy="220" r="10" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="470" cy="220" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
  <circle cx="825" cy="220" r="10" fill="#059669" stroke="#ffffff" stroke-width="3"/>
</svg>
