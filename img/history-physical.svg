<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gServer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect width="960" height="400" rx="18" fill="url(#dotGrid)"/>

  <!-- 3 Physical Rack Servers -->
  <g filter="url(#shadow)">
    <!-- Server 1 -->
    <rect x="48" y="36" width="268" height="328" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="182" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Physical Server #1</text>
    <rect x="72" y="90" width="220" height="62" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="182" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Single Application</text>
    <text x="182" y="138" text-anchor="middle" font-size="11.5" fill="#3b82f6"> ~10% CPU Utilization</text>
    <rect x="72" y="164" width="220" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="182" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Operating System</text>
    <rect x="72" y="220" width="220" height="120" rx="10" fill="url(#gServer)"/>
    <circle cx="96" cy="250" r="5" fill="#10b981"/>
    <circle cx="114" cy="250" r="5" fill="#38bdf8"/>
    <rect x="180" y="245" width="90" height="8" rx="4" fill="#475569"/>
    <text x="182" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Dedicated Hardware</text>
    <text x="182" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">CPU • RAM • Disk • NIC</text>

    <!-- Server 2 -->
    <rect x="346" y="36" width="268" height="328" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="480" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Physical Server #2</text>
    <rect x="370" y="90" width="220" height="62" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="480" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Database Server</text>
    <text x="480" y="138" text-anchor="middle" font-size="11.5" fill="#059669"> ~15% CPU Utilization</text>
    <rect x="370" y="164" width="220" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="480" y="191" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Operating System</text>
    <rect x="370" y="220" width="220" height="120" rx="10" fill="url(#gServer)"/>
    <circle cx="394" cy="250" r="5" fill="#10b981"/>
    <circle cx="412" cy="250" r="5" fill="#38bdf8"/>
    <rect x="478" y="245" width="90" height="8" rx="4" fill="#475569"/>
    <text x="480" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Dedicated Hardware</text>
    <text x="480" y="312" text-anchor="middle" font-size="12" fill="#94a3b8">CPU • RAM • Disk • NIC</text>

    <!-- Pain points card -->
    <rect x="644" y="36" width="268" height="328" rx="16" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="778" y="76" text-anchor="middle" font-size="17" font-weight="800" fill="#be123c">Key Limitations</text>
    <rect x="668" y="96" width="220" height="54" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="778" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">Wasted Capacity</text>
    <text x="778" y="138" text-anchor="middle" font-size="11.5" fill="#64748b">Servers idle 80–90% of the time</text>

    <rect x="668" y="164" width="220" height="54" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="778" y="188" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">Slow Provisioning</text>
    <text x="778" y="206" text-anchor="middle" font-size="11.5" fill="#64748b">Weeks/months to buy &amp; rack</text>

    <rect x="668" y="232" width="220" height="54" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="778" y="256" text-anchor="middle" font-size="13.5" font-weight="700" fill="#9f1239">High CapEx &amp; Ops Cost</text>
    <text x="778" y="274" text-anchor="middle" font-size="11.5" fill="#64748b">Power, cooling, cabling, space</text>

    <rect x="668" y="300" width="220" height="44" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="1"/>
    <text x="778" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">1 App = 1 Physical Server</text>
  </g>
</svg>
