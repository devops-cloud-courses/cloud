<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gBackbone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrBlueStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
    <marker id="arrTealStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="18" fill="#f8fafc"/>
  <rect width="960" height="420" rx="18" fill="url(#dotGrid)"/>

  <!-- Top Banner -->
  <g filter="url(#shadow)">
    <rect x="230" y="16" width="500" height="36" rx="18" fill="url(#gBackbone)"/>
    <text x="480" y="39" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Hyperscaler Global Fiber Network &amp; Edge CDN PoPs</text>
  </g>

  <!-- Step 1: End Users -->
  <g filter="url(#shadow)">
    <rect x="34" y="84" width="184" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="50" y="102" width="152" height="32" rx="8" fill="#f1f5f9"/>
    <text x="126" y="123" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Global End Users</text>
    <text x="126" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Browsers &amp; Mobile Apps</text>
    <text x="126" y="182" text-anchor="middle" font-size="11.5" fill="#64748b">• Anycast Global IP</text>
    <text x="126" y="202" text-anchor="middle" font-size="11.5" fill="#64748b">• Local ISP Last-Mile</text>
    <text x="126" y="222" text-anchor="middle" font-size="11.5" fill="#64748b">• Enters Cloud at nearest</text>
    <text x="126" y="240" text-anchor="middle" font-size="11.5" fill="#64748b">city Edge PoP</text>
    <rect x="54" y="254" width="144" height="24" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="126" y="270" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">&lt; 10 ms First Hop</text>
  </g>

  <!-- Arrow: Users <-> Edge PoP -->
  <line x1="224" y1="188" x2="282" y2="188" stroke="#0d9488" stroke-width="3" marker-start="url(#arrTealStart)" marker-end="url(#arrTeal)"/>
  <text x="253" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0f766e">HTTPS</text>

  <!-- Step 2: Edge PoP & Cloud CDN -->
  <g filter="url(#shadow)">
    <rect x="290" y="72" width="236" height="234" rx="16" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
    <rect x="308" y="90" width="200" height="34" rx="8" fill="#0d9488"/>
    <text x="408" y="112" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">200+ Edge PoPs &amp; CDN</text>

    <rect x="310" y="138" width="196" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2"/>
    <text x="408" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#0f766e">Edge Caching (Cloud CDN)</text>
    <text x="408" y="180" text-anchor="middle" font-size="11" fill="#334155">Static assets served directly at Edge</text>

    <rect x="310" y="208" width="196" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="408" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">TLS &amp; DDoS Shield</text>
    <text x="408" y="250" text-anchor="middle" font-size="11" fill="#475569">Terminates SSL/TLS &amp; blocks L3/L7 attacks</text>

    <text x="408" y="288" text-anchor="middle" font-size="11" font-weight="600" fill="#0f766e">Peering in 100+ countries &amp; IXPs</text>
  </g>

  <!-- Subsea & Terrestrial Fiber Conduit: Edge PoP <-> Cloud Regions -->
  <rect x="534" y="156" width="152" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="538" y1="176" x2="682" y2="176" stroke="#2563eb" stroke-width="3" marker-start="url(#arrBlueStart)" marker-end="url(#arrBlue)"/>
  <line x1="538" y1="200" x2="682" y2="200" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#arrBlueStart)" marker-end="url(#arrBlue)"/>
  <text x="610" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">Private Subsea Fiber</text>
  <text x="610" y="236" text-anchor="middle" font-size="10.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1e40af">100+ Tbps Backbone</text>

  <!-- Step 3: Cloud Regions -->
  <g filter="url(#shadow)">
    <rect x="694" y="72" width="232" height="234" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="712" y="90" width="196" height="34" rx="8" fill="#2563eb"/>
    <text x="810" y="112" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">Cloud Regions (Compute)</text>

    <rect x="714" y="138" width="192" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="810" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">us-east / europe-west</text>
    <text x="810" y="175" text-anchor="middle" font-size="11" fill="#334155">Global Load Balancer &amp; VMs</text>

    <rect x="714" y="194" width="192" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="810" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">asia-east / sa-east</text>
    <text x="810" y="231" text-anchor="middle" font-size="11" fill="#334155">Cross-Region DB Replication</text>

    <rect x="714" y="252" width="192" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="810" y="275" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">SDN Traffic Engineering</text>
  </g>

  <!-- Bottom Comparison Callout: Cold Potato vs Hot Potato Routing -->
  <g filter="url(#shadow)">
    <rect x="34" y="326" width="892" height="74" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="52" y="343" width="210" height="40" rx="8" fill="#dbeafe"/>
    <text x="157" y="361" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e40af">Cold-Potato Routing</text>
    <text x="157" y="376" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">(Premium Global Backbone)</text>
    <text x="282" y="358" font-size="12.5" font-weight="600" fill="#0f172a">Traffic enters the provider's private fiber at the closest Edge PoP and travels across dedicated</text>
    <text x="282" y="378" font-size="12.5" fill="#475569">transoceanic subsea cables — avoiding congested public internet hops, packet loss, and BGP hijacks.</text>
  </g>
</svg>
