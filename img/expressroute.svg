<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="18" fill="#f8fafc"/>
  <rect width="960" height="360" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Corporate Network -->
    <rect x="34" y="42" width="252" height="276" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="160" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Customer On-Premises</text>
    <text x="160" y="100" text-anchor="middle" font-size="12" fill="#64748b">Corporate Datacenter / MPLS</text>
    <rect x="58" y="118" width="204" height="58" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="160" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Core Enterprise Routers</text>
    <rect x="58" y="218" width="204" height="68" rx="10" fill="#1e293b"/>
    <text x="160" y="248" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Redundant Edge Routers</text>
    <text x="160" y="268" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#94a3b8">Customer Cage / Colocation</text>

    <!-- Dedicated Private Peering Location -->
    <rect x="336" y="176" width="288" height="136" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
    <rect x="358" y="158" width="244" height="30" rx="15" fill="#059669"/>
    <text x="480" y="178" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">Dedicated Private Circuit (No Internet)</text>
    <text x="480" y="216" text-anchor="middle" font-size="13.5" font-weight="800" fill="#065f46">ExpressRoute / Direct Connect</text>
    <text x="480" y="242" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#047857">Dual Active-Active BGP Fiber</text>
    <text x="480" y="266" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#059669">1 Gbps to 100 Gbps • Guaranteed SLA</text>
    <text x="480" y="290" text-anchor="middle" font-size="11.5" fill="#047857">Meet-Me Peering Location (Equinix / Telco)</text>

    <!-- Cloud VNet / VPC -->
    <rect x="674" y="42" width="252" height="276" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="800" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Cloud Environment</text>
    <text x="800" y="100" text-anchor="middle" font-size="12" fill="#2563eb">VNets / VPCs &amp; PaaS Services</text>
    <rect x="698" y="118" width="204" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="800" y="152" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e40af">Production Workloads</text>
    <rect x="698" y="218" width="204" height="68" rx="10" fill="#2563eb"/>
    <text x="800" y="248" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">ExpressRoute / DX Gateway</text>
    <text x="800" y="268" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Private &amp; Microsoft/Cloud Peering</text>
  </g>

  <!-- Internal & Dedicated Fiber Flow Arrows -->
  <!-- On-Prem Core <-> Edge Routers -->
  <line x1="160" y1="182" x2="160" y2="212" stroke="#475569" stroke-width="2.5" marker-start="url(#arrowSlate)" marker-end="url(#arrowSlate)"/>

  <!-- Cloud Workloads <-> ER/DX Gateway -->
  <line x1="800" y1="182" x2="800" y2="212" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>

  <!-- Dual Redundant Active-Active Circuits (Primary + Secondary Fiber) -->
  <line x1="268" y1="240" x2="330" y2="240" stroke="#059669" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <line x1="268" y1="264" x2="330" y2="264" stroke="#059669" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>

  <line x1="630" y1="240" x2="692" y2="240" stroke="#059669" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <line x1="630" y1="264" x2="692" y2="264" stroke="#059669" stroke-width="3" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>

  <!-- End-to-End Predictable Latency Curve -->
  <path d="M 268 147 C 400 102, 560 102, 692 147" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="6 4" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <rect x="352" y="96" width="256" height="26" rx="13" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="480" y="113" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">Predictable Latency &amp; Bandwidth</text>
</svg>
