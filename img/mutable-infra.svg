<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="18" fill="#f8fafc"/>
  <rect width="960" height="360" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Step 1 -->
    <rect x="40" y="64" width="190" height="150" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="135" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Server v1.0</text>
    <text x="135" y="128" text-anchor="middle" font-size="12.5" fill="#64748b">Clean initial deploy</text>
    <rect x="64" y="150" width="142" height="36" rx="8" fill="#eff6ff"/>
    <text x="135" y="173" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#2563eb">Known State</text>

    <!-- Arrow 1 -->
    <line x1="234" y1="139" x2="278" y2="139" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="256" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">SSH Patch</text>

    <!-- Step 2 -->
    <rect x="284" y="64" width="190" height="150" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="379" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="#b45309">Server v1.1?</text>
    <text x="379" y="128" text-anchor="middle" font-size="12.5" fill="#64748b">Manual OS update</text>
    <rect x="308" y="150" width="142" height="36" rx="8" fill="#fef3c7"/>
    <text x="379" y="173" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#d97706">Minor Drift</text>

    <!-- Arrow 2 -->
    <line x1="478" y1="139" x2="522" y2="139" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="500" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">Hotfix</text>

    <!-- Step 3 -->
    <rect x="528" y="64" width="190" height="150" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
    <text x="623" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="#c2410c">Server v1.x??</text>
    <text x="623" y="128" text-anchor="middle" font-size="12.5" fill="#64748b">Untracked config edit</text>
    <rect x="552" y="150" width="142" height="36" rx="8" fill="#ffedd5"/>
    <text x="623" y="173" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#ea580c">Snowflake Server</text>

    <!-- Arrow 3 -->
    <line x1="722" y1="139" x2="766" y2="139" stroke="#e11d48" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <text x="744" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">Crash!</text>

    <!-- Step 4 -->
    <rect x="772" y="64" width="150" height="150" rx="14" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="847" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="#be123c">Outage</text>
    <text x="847" y="128" text-anchor="middle" font-size="12" fill="#9f1239">Cannot reproduce</text>
    <rect x="790" y="150" width="114" height="36" rx="8" fill="#ffe4e6"/>
    <text x="847" y="173" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#e11d48">Unrecoverable</text>

    <!-- Bottom Callout -->
    <rect x="40" y="246" width="882" height="76" rx="14" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="481" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#9f1239">The "Phoenix / Snowflake Server" Problem</text>
    <text x="481" y="302" text-anchor="middle" font-size="13.5" fill="#334155">In-place manual changes cause Configuration Drift — no two servers are identical, and rebuilding from scratch fails.</text>
  </g>
</svg>
