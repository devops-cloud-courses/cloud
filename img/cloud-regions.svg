<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect width="960" height="400" rx="18" fill="url(#dotGrid)"/>

  <!-- Backbone network arcs -->
  <path d="M 200 180 Q 380 80 510 155" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 510 155 Q 670 90 790 185" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M 200 180 Q 480 280 790 185" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4 4"/>

  <g filter="url(#shadow)">
    <!-- Americas -->
    <rect x="44" y="68" width="268" height="210" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="64" y="88" width="228" height="36" rx="8" fill="url(#gBlue)"/>
    <text x="178" y="111" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Americas Regions</text>
    <text x="80" y="152" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• us-east (N. Virginia)</text>
    <text x="80" y="178" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• us-west (Oregon / CA)</text>
    <text x="80" y="204" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• ca-central (Canada)</text>
    <text x="80" y="230" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• sa-east (São Paulo)</text>
    <text x="178" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">Low-latency coverage across N/S America</text>

    <!-- EMEA -->
    <rect x="346" y="42" width="268" height="236" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="366" y="62" width="228" height="36" rx="8" fill="url(#gBlue)"/>
    <text x="480" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Europe &amp; MEA Regions</text>
    <text x="382" y="126" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• eu-west (Paris, Ireland)</text>
    <text x="382" y="152" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• eu-central (Frankfurt)</text>
    <text x="382" y="178" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• eu-north (Stockholm)</text>
    <text x="382" y="204" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• me-central (UAE / Doha)</text>
    <text x="382" y="230" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• af-south (Cape Town)</text>
    <text x="480" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">GDPR &amp; data sovereignty compliance</text>

    <!-- APAC -->
    <rect x="648" y="68" width="268" height="210" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="668" y="88" width="228" height="36" rx="8" fill="url(#gBlue)"/>
    <text x="782" y="111" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Asia-Pacific Regions</text>
    <text x="684" y="152" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• ap-southeast (Singapore)</text>
    <text x="684" y="178" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• ap-northeast (Tokyo, Seoul)</text>
    <text x="684" y="204" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• ap-south (Mumbai)</text>
    <text x="684" y="230" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#1e40af">• australia-southeast (Sydney)</text>
    <text x="782" y="260" text-anchor="middle" font-size="11.5" fill="#64748b">High-growth global edge footprint</text>

    <!-- Bottom Summary Banner -->
    <rect x="44" y="302" width="872" height="68" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="480" y="332" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">30–60+ Regions Per Hyperscaler (AWS, Azure, Google Cloud)</text>
    <text x="480" y="354" text-anchor="middle" font-size="13" fill="#334155">Dedicated private subsea &amp; terrestrial fiber backbone • 100+ Availability Zones • 400+ CDN Edge POPs</text>
  </g>
</svg>
