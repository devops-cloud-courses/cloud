<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="18" fill="#f8fafc"/>
  <rect width="960" height="400" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Top Banner: Root Organization & Management Groups -->
    <rect x="40" y="26" width="880" height="62" rx="14" fill="url(#gTop)"/>
    <text x="480" y="54" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Enterprise Cloud Landing Zone (Foundation &amp; Guardrails)</text>
    <text x="480" y="75" text-anchor="middle" font-size="12.5" fill="#dbeafe">Pre-configured, secure, multi-subscription / multi-account environment ready for workloads</text>

    <!-- 4 Foundation Pillars -->
    <rect x="40" y="106" width="208" height="148" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="58" y="122" width="172" height="30" rx="6" fill="#eff6ff"/>
    <text x="144" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e40af">Identity &amp; Access</text>
    <text x="144" y="174" text-anchor="middle" font-size="12.5" fill="#334155">• Central SSO / Entra ID</text>
    <text x="144" y="198" text-anchor="middle" font-size="12.5" fill="#334155">• RBAC &amp; Least Privilege</text>
    <text x="144" y="222" text-anchor="middle" font-size="12.5" fill="#334155">• PIM &amp; MFA Policies</text>

    <rect x="264" y="106" width="208" height="148" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="282" y="122" width="172" height="30" rx="6" fill="#eff6ff"/>
    <text x="368" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e40af">Networking &amp; Hybrid</text>
    <text x="368" y="174" text-anchor="middle" font-size="12.5" fill="#334155">• Hub &amp; Spoke Topology</text>
    <text x="368" y="198" text-anchor="middle" font-size="12.5" fill="#334155">• Central Firewall &amp; DNS</text>
    <text x="368" y="222" text-anchor="middle" font-size="12.5" fill="#334155">• IP Address Management</text>

    <rect x="488" y="106" width="208" height="148" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="506" y="122" width="172" height="30" rx="6" fill="#eff6ff"/>
    <text x="592" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e40af">Security &amp; Policy</text>
    <text x="592" y="174" text-anchor="middle" font-size="12.5" fill="#334155">• Policy-as-Code Guardrails</text>
    <text x="592" y="198" text-anchor="middle" font-size="12.5" fill="#334155">• Central SIEM &amp; Audit Logs</text>
    <text x="592" y="222" text-anchor="middle" font-size="12.5" fill="#334155">• KMS &amp; Key Vaults</text>

    <rect x="712" y="106" width="208" height="148" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="730" y="122" width="172" height="30" rx="6" fill="#eff6ff"/>
    <text x="816" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e40af">Ops &amp; FinOps</text>
    <text x="816" y="174" text-anchor="middle" font-size="12.5" fill="#334155">• Cost Budgets &amp; Tagging</text>
    <text x="816" y="198" text-anchor="middle" font-size="12.5" fill="#334155">• Central Monitoring</text>
    <text x="816" y="222" text-anchor="middle" font-size="12.5" fill="#334155">• Account Vending (IaC)</text>

    <!-- Bottom Row: Workload Subscriptions / Accounts -->
    <rect x="40" y="274" width="880" height="98" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="480" y="302" text-anchor="middle" font-size="15" font-weight="800" fill="#065f46">Isolated Workload Landing Zones (Subscriptions / AWS Accounts / GCP Projects)</text>
    <rect x="64" y="316" width="196" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="162" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Production App A</text>
    <rect x="276" y="316" width="196" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="374" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Production App B</text>
    <rect x="488" y="316" width="196" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="586" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Data &amp; AI Platform</text>
    <rect x="700" y="316" width="196" height="40" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="798" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Dev / Sandbox Env</text>
  </g>
</svg>
