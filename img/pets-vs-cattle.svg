<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="390" rx="18" fill="#f8fafc"/>
  <rect width="960" height="390" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Left: Pets -->
    <rect x="40" y="30" width="420" height="330" rx="18" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <rect x="68" y="54" width="364" height="46" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <text x="250" y="83" text-anchor="middle" font-size="18" font-weight="800" fill="#be123c">Pets (Traditional Servers)</text>

    <text x="76" y="136" font-size="14.5" font-weight="700" fill="#0f172a">• Given custom names (`zeus`, `apollo`, `db-prod`)</text>
    <text x="76" y="172" font-size="14.5" font-weight="700" fill="#0f172a">• Manually built, configured &amp; SSH'd into</text>
    <text x="76" y="208" font-size="14.5" font-weight="700" fill="#0f172a">• When sick, you nurse them back to health</text>
    <text x="76" y="244" font-size="14.5" font-weight="700" fill="#0f172a">• Scaled vertically (bigger hardware)</text>
    <text x="76" y="280" font-size="14.5" font-weight="700" fill="#be123c">• Single point of failure &amp; "Snowflake" drift</text>

    <rect x="68" y="302" width="364" height="36" rx="8" fill="#f1f5f9"/>
    <text x="250" y="325" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#64748b">Unique • Fragile • Manual Ops</text>

    <!-- Right: Cattle -->
    <rect x="500" y="30" width="420" height="330" rx="18" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="528" y="54" width="364" height="46" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="710" y="83" text-anchor="middle" font-size="18" font-weight="800" fill="#047857">Cattle (Cloud-Native Fleet)</text>

    <text x="536" y="136" font-size="14.5" font-weight="700" fill="#0f172a">• Assigned IDs (`i-0a98f32b`, `vm-web-042`)</text>
    <text x="536" y="172" font-size="14.5" font-weight="700" fill="#0f172a">• Identical &amp; provisioned via automation / IaC</text>
    <text x="536" y="208" font-size="14.5" font-weight="700" fill="#0f172a">• When unhealthy, terminated &amp; replaced automatically</text>
    <text x="536" y="244" font-size="14.5" font-weight="700" fill="#0f172a">• Scaled horizontally via Auto Scaling Groups</text>
    <text x="536" y="280" font-size="14.5" font-weight="700" fill="#047857">• Zero human intervention required</text>

    <rect x="528" y="302" width="364" height="36" rx="8" fill="#ecfdf5"/>
    <text x="710" y="325" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#059669">Disposable • Reproducible • Automated</text>
  </g>
</svg>
