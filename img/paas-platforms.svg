<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="360" rx="18" fill="#f8fafc"/>
  <rect width="960" height="360" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Card 1: Heroku -->
    <rect x="40" y="38" width="276" height="284" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="64" y="62" width="228" height="44" rx="10" fill="#7c3aed"/>
    <text x="178" y="90" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">Heroku (2007)</text>
    <text x="178" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">The Developer Experience Pioneer</text>
    <rect x="64" y="160" width="228" height="36" rx="8" fill="#f5f3ff"/>
    <text x="178" y="183" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#6d28d9">git push heroku main</text>
    <text x="178" y="226" text-anchor="middle" font-size="13" fill="#334155">• Buildpacks &amp; Managed Dynos</text>
    <text x="178" y="252" text-anchor="middle" font-size="13" fill="#334155">• One-click Add-ons (Postgres, Redis)</text>
    <text x="178" y="278" text-anchor="middle" font-size="13" fill="#334155">• Inspired the 12-Factor App</text>

    <!-- Card 2: Google App Engine -->
    <rect x="342" y="38" width="276" height="284" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="366" y="62" width="228" height="44" rx="10" fill="#2563eb"/>
    <text x="480" y="90" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Google App Engine (2008)</text>
    <text x="480" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">First Hyperscaler PaaS</text>
    <rect x="366" y="160" width="228" height="36" rx="8" fill="#eff6ff"/>
    <text x="480" y="183" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">gcloud app deploy</text>
    <text x="480" y="226" text-anchor="middle" font-size="13" fill="#334155">• Fully managed runtime sandboxes</text>
    <text x="480" y="252" text-anchor="middle" font-size="13" fill="#334155">• Automatic global scaling</text>
    <text x="480" y="278" text-anchor="middle" font-size="13" fill="#334155">• Built-in traffic splitting</text>

    <!-- Card 3: Modern Cloud PaaS -->
    <rect x="644" y="38" width="276" height="284" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <rect x="668" y="62" width="228" height="44" rx="10" fill="#059669"/>
    <text x="782" y="90" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">Modern Cloud PaaS</text>
    <text x="782" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Managed App &amp; Data Platforms</text>
    <rect x="668" y="160" width="228" height="36" rx="8" fill="#ecfdf5"/>
    <text x="782" y="183" text-anchor="middle" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#047857">SLA-driven services</text>
    <text x="782" y="226" text-anchor="middle" font-size="13" fill="#334155">• Cloud Run / Azure App Service</text>
    <text x="782" y="252" text-anchor="middle" font-size="13" fill="#334155">• AWS App Runner / Container Apps</text>
    <text x="782" y="278" text-anchor="middle" font-size="13" fill="#334155">• Aurora, AlloyDB, Cosmos DB</text>
  </g>
</svg>
