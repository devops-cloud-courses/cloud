<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="960" height="390" rx="18" fill="#f8fafc"/>
  <rect width="960" height="390" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Users -->
    <rect x="34" y="140" width="146" height="110" rx="14" fill="#1e293b"/>
    <text x="107" y="188" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Web / Mobile</text>
    <text x="107" y="212" text-anchor="middle" font-size="12" fill="#38bdf8">End Users</text>

    <!-- Edge / Auth / Static -->
    <rect x="228" y="34" width="200" height="94" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="328" y="72" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">CDN + Object Storage</text>
    <text x="328" y="94" text-anchor="middle" font-size="12" fill="#64748b">Static SPA Frontend</text>
    <text x="328" y="112" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#2563eb">CloudFront + S3</text>

    <rect x="228" y="148" width="200" height="94" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="328" y="186" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1d4ed8">API Gateway</text>
    <text x="328" y="208" text-anchor="middle" font-size="12" fill="#3b82f6">REST / GraphQL / WS</text>
    <text x="328" y="226" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#1e40af">Zero idle cost</text>

    <rect x="228" y="262" width="200" height="94" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="328" y="300" text-anchor="middle" font-size="14.5" font-weight="800" fill="#047857">Identity (BaaS)</text>
    <text x="328" y="322" text-anchor="middle" font-size="12" fill="#64748b">JWT / OAuth2 / OIDC</text>
    <text x="328" y="340" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">Cognito / Auth0</text>

    <!-- FaaS Layer -->
    <rect x="484" y="64" width="200" height="114" rx="14" fill="#2563eb"/>
    <text x="584" y="106" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">FaaS: Order Service</text>
    <text x="584" y="130" text-anchor="middle" font-size="12" fill="#dbeafe">Lambda / Cloud Run Functions</text>
    <text x="584" y="152" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#93c5fd">Auto-scales per req</text>

    <rect x="484" y="212" width="200" height="114" rx="14" fill="#4f46e5"/>
    <text x="584" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">FaaS: Async Worker</text>
    <text x="584" y="278" text-anchor="middle" font-size="12" fill="#e0e7ff">EventBridge / PubSub</text>
    <text x="584" y="300" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#c7d2fe">Event-driven trigger</text>

    <!-- Managed Data & Events -->
    <rect x="740" y="64" width="186" height="114" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="833" y="106" text-anchor="middle" font-size="14.5" font-weight="800" fill="#5b21b6">Serverless NoSQL</text>
    <text x="833" y="130" text-anchor="middle" font-size="12" fill="#64748b">DynamoDB / Firestore</text>
    <text x="833" y="152" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#7c3aed">Pay-per-read/write</text>

    <rect x="740" y="212" width="186" height="114" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <text x="833" y="254" text-anchor="middle" font-size="14.5" font-weight="800" fill="#b45309">Managed Queue/Bus</text>
    <text x="833" y="278" text-anchor="middle" font-size="12" fill="#64748b">SQS / SNS / EventBus</text>
    <text x="833" y="300" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#d97706">Decoupled messaging</text>
  </g>

  <line x1="180" y1="168" x2="220" y2="92" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="180" y1="195" x2="220" y2="195" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="222" x2="220" y2="298" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>

  <line x1="428" y1="180" x2="476" y2="132" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="428" y1="210" x2="476" y2="258" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="684" y1="121" x2="732" y2="121" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="684" y1="148" x2="732" y2="246" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="740" y1="269" x2="692" y2="269" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
