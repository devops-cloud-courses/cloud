<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#cbd5e1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="gZoneA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gZoneB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="430" rx="18" fill="#f8fafc"/>
  <rect width="960" height="430" rx="18" fill="url(#dotGrid)"/>

  <g filter="url(#shadow)">
    <!-- Left Card: europe-west4-a (Flagship Zone) -->
    <rect x="38" y="24" width="428" height="304" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="58" y="42" width="388" height="40" rx="10" fill="url(#gZoneA)"/>
    <text x="252" y="67" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">europe-west4-a (Tier-1 Hub Zone)</text>

    <!-- CPU Platforms -->
    <text x="64" y="108" font-size="12.5" font-weight="800" fill="#1e40af">Available CPU &amp; Custom Silicon:</text>
    <text x="76" y="128" font-size="12" fill="#334155">• Intel Xeon Emerald / Granite Rapids (C4, N4, M4)</text>
    <text x="76" y="148" font-size="12" fill="#334155">• AMD EPYC Genoa / Turin (C3D, C4D) &amp; Google Axion ARM (C4A)</text>

    <!-- Machine Series -->
    <text x="64" y="178" font-size="12.5" font-weight="800" fill="#1e40af">Machine Families &amp; AI Accelerators:</text>
    <text x="76" y="198" font-size="12" fill="#334155">• General &amp; Compute: N4, C4, C4D, C4A (up to 384 vCPUs)</text>
    <text x="76" y="218" font-size="12" fill="#334155">• AI / GPU Clusters: A3 Ultra (H200), A4 (B200), TPU v6e Trillium</text>
    <text x="76" y="238" font-size="12" fill="#334155">• Memory-Optimized: M4 &amp; X4 (up to 1,920 vCPUs &amp; 32 TB RAM)</text>

    <!-- Specialized Hardware Badges -->
    <rect x="64" y="260" width="124" height="30" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <text x="126" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">✓ B200 &amp; TPU v6e</text>

    <rect x="196" y="260" width="118" height="30" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <text x="255" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">✓ Hyperdisk NVMe</text>

    <rect x="322" y="260" width="124" height="30" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <text x="384" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">✓ 32 TB UltraMem</text>

    <!-- Right Card: southamerica-east1-b (Smaller Regional Zone) -->
    <rect x="494" y="24" width="428" height="304" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="514" y="42" width="388" height="40" rx="10" fill="url(#gZoneB)"/>
    <text x="708" y="67" text-anchor="middle" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="800" fill="#ffffff">southamerica-east1-b (Regional Zone)</text>

    <!-- CPU Platforms -->
    <text x="520" y="108" font-size="12.5" font-weight="800" fill="#334155">Available CPU Platforms:</text>
    <text x="532" y="128" font-size="12" fill="#475569">• Intel Xeon Cascade Lake / Sapphire Rapids (N2, C3)</text>
    <text x="532" y="148" font-size="12" fill="#475569">• AMD EPYC Milan / Genoa (N2D, C3D)</text>

    <!-- Machine Series -->
    <text x="520" y="178" font-size="12.5" font-weight="800" fill="#334155">Machine Families &amp; Capacities:</text>
    <text x="532" y="198" font-size="12" fill="#475569">• General &amp; Compute: E2, N2, N2D, C3 (up to 176–224 vCPUs)</text>
    <text x="532" y="218" font-size="12" fill="#94a3b8">• Next-Gen Silicon (C4 / Axion C4A / A4 B200): Not in zone</text>
    <text x="532" y="238" font-size="12" fill="#475569">• Memory-Optimized: M2 / M3 (up to 416 vCPUs &amp; 11.5 TB RAM)</text>

    <!-- Specialized Hardware Badges -->
    <rect x="520" y="260" width="124" height="30" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="582" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">✗ No B200 / TPU</text>

    <rect x="652" y="260" width="118" height="30" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
    <text x="711" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#15803d">✓ Local NVMe SSD</text>

    <rect x="778" y="260" width="124" height="30" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.2"/>
    <text x="840" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">! Max 11.5 TB RAM</text>

    <!-- Bottom Takeaway Banner -->
    <rect x="38" y="344" width="884" height="68" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="480" y="371" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e3a8a">Not All Availability Zones Are Identical in Hardware!</text>
    <text x="480" y="393" text-anchor="middle" font-size="12" fill="#334155">CPU generations, GPU accelerators, and UltraMem SKUs vary by zone • Always verify SKU availability across 2+ AZs for High Availability</text>
  </g>
</svg>
